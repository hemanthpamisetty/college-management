<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register-RGMCET</title>

    <link rel="icon" type="image/clglogo" href="/images/clglogo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/register.css">
  </head>

  <body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow" style="width: 22rem;">
        <div class="card-body text-center">
            <h1 class="card-title">Create Account</h1>
            <p class="card-text">Register to continue</p>

            <!-- FORM -->
            <form id="registerForm">

                <div class="mb-3 text-start">
                   <label class="form-label">Email address</label>
                   <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                </div>

                <div class="mb-3 text-start">
                   <label class="form-label">Registration number</label>
                   <input type="text" class="form-control" id="textInput" placeholder="Reg-number">
                </div>

                <div class="mb-3 text-start">
                  <label class="form-label">Set Password</label>
                  <input type="password" class="form-control" id="passwordInput" placeholder="Password">
                </div>

                <p>If you already have an account? <a href="../components/login.html">Login</a></p>

                <!-- ERROR MESSAGE -->
                <p id="error" class="text-danger"></p>
                <p id="success" class="text-success"></p>

                <!-- REGISTER BUTTON -->
                <button type="submit" class="btn btn-primary w-100" id="Register_button">
                    Register
                </button>

            </form>
        </div>
    </div>
    <script src="../components/register.js"></script>
    <script>
      history.pushState(null, null, location.href);
      window.onpopstate = function () {
      window.location.href = "../components/login.html";   // back → login
      };
    </script>
</body>

  </body>
</html>
