<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login-RGMCET</title>

    <link rel="icon" type="image/clglogo" href="/images/clglogo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
  </head>

  <body class="d-flex justify-content-center align-items-center background-transparent vh-100" id="login-container">
    <div class="card shadow" style="width: 22rem;">
        <div class="card-body text-center">
            <h1 class="card-title">Welcome</h1>
            <p class="card-text">Please login to continue</p>

            <!-- FORM -->
            <form id="loginForm">

                <div class="mb-3 text-start">
                   <label class="form-label">Registration number</label>
                   <input type="text" class="form-control" id="textInput" placeholder="Reg-number" required>
                </div>

                <div class="mb-3 text-start">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" id="passwordInput" placeholder="Password">
                </div>

                <p>Don't have an account? <a href="register.html">Register here</a></p>

                <!-- ERROR MESSAGE -->
                <p id="error" class="text-danger"></p>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="btn btn-primary w-100" id="Login_button">Login</button>

            </form>
        </div>
    </div>
    <script src="../components/login.js"></script>
    <script>
      history.pushState(null, null, location.href);
      window.onpopstate = function () {
      window.location.href = "../components/interface.html";   // back → home page
    };
    </script>
</body>

  </body>
</html>
